name: Papers Pipeline CI

# Quality lane for the live-paper publisher and the paper-chat Worker.
# Deliberately separate from "Build and Deploy Site": a red run here reports a
# problem with work in progress, it does not stop the CV/site from publishing.

on:
  push:
    branches: [main]
    paths:
      - 'papers/**'
      - 'services/paper-chat/**'
      - '.github/workflows/papers-ci.yml'
  pull_request:
    paths:
      - 'papers/**'
      - 'services/paper-chat/**'
      - '.github/workflows/papers-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-tests:
    name: Live-paper publisher and deployment gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      # paperlib.build_file_chunks shells out to `latexpand`, absent on a bare
      # runner. Do NOT apt-get texlive-extra-utils for this: it drags in the
      # whole TeX Live tree and ran >10 min before being cancelled. latexpand is
      # a single dependency-free Perl script, so fetch it pinned by tag+digest.
      - name: Install latexpand
        env:
          LATEXPAND_URL: https://gitlab.com/latexpand/latexpand/-/raw/v1.7.2/latexpand
          LATEXPAND_SHA256: 4c3ef0a02b25a998f91f2de109e139dcd6b4200e1939b3aa3702a7ddf1ffe0f6
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "${RUNNER_TEMP}/bin/latexpand" "${LATEXPAND_URL}"
          echo "${LATEXPAND_SHA256}  ${RUNNER_TEMP}/bin/latexpand" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/bin/latexpand"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/latexpand" --version

      - name: Run publisher tests
        run: python3 -m unittest discover papers/tests -v

      - name: Verify production build excludes unapproved drafts
        run: python3 papers/scripts/build_papers.py --output "${RUNNER_TEMP}/_papers"

  worker-tests:
    name: paper-chat Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/paper-chat/package-lock.json

      - name: Install Worker dependencies
        working-directory: services/paper-chat
        run: npm ci

      - name: Test Worker
        working-directory: services/paper-chat
        run: npm test
